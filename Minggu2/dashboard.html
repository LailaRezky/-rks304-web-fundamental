<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

<!-- NAVBAR / HEADER -->
<nav class="bg-blue-600 fixed w-full z-30 top-0 h-16 flex items-center justify-between px-6 shadow-md">
    <!-- Logo Text (Kiri) -->
    <div class="flex items-center space-x-3">
        <span class="text-2xl font-bold text-white tracking-wide">
            L-Shop
        </span>
    </div>

    <!-- Logout Button (Ujung Kanan) -->
    <div>
        <a href="#logout" class="flex items-center space-x-2 text-sm font-medium text-blue-600 bg-white hover:bg-blue-50 px-4 py-2 rounded-lg transition-colors shadow-sm">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>
</nav>

    <!-- CONTAINER UTAMA (SIDEBAR + KONTEN) -->
    <div class="flex pt-16 min-h-screen">
        <!--  -->

        <!-- SIDEBAR (BAGIAN KIRI) -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 flex-shrink-0">
            <!-- Top Section: 5 Menu Navigasi -->
            <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 px-3">Main Menu</p>
                <nav class="space-y-1">
                    <!-- Menu 1: -->
                    <a href="dashboard.html" class="flex items-center space-x-3 text-blue-600 bg-blue-50 font-medium px-3 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                        <span>Dashboard</span>
                    </a>

                    <!-- Menu 2: -->
                    <a href="product.html" class="flex items-center space-x-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium px-3 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-chart-line w-5 text-center"></i>
                        <span>Products</span>
                    </a>

                    <!-- Menu 3: -->
                    <a href="#" class="flex items-center space-x-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium px-3 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-file-invoice w-5 text-center"></i>
                        <span>Users</span>
                    </a>

                    <!-- Menu 4:  -->
                    <a href="#" class="flex items-center space-x-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium px-3 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-users w-5 text-center"></i>
                        <span>Setting</span>
                    </a>
                </nav>
            </div>

        </aside>

         <!-- AREA KONTEN UTAMA -->
<main class="flex-1 p-6 md:p-8 space-y-8">

  <!-- Header Section -->
  <section>
    <h2 class="text-xl font-bold text-gray-800 mb-1">Ringkasan Sistem E-Commerce</h2>
    <p class="text-sm text-gray-600">Pantau performa penjualan, pesanan, dan pengunjung toko online Anda hari ini.</p>
  </section>

  <!-- Grid Card Section (Cuma butuh 1 section ini aja) -->
  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <!-- Card 1 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-500">Total Penjualan</h3>
        <i class="fa-solid fa-money-bill-wave text-green-600"></i>
      </div>
      <p class="text-2xl font-bold text-gray-800 mt-3">25.000.000</p>
    </div>

    <!-- Card 2 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-500">Total Pesanan</h3>
        <i class="fa-solid fa-cart-shopping text-blue-600"></i>
      </div>
      <p class="text-2xl font-bold text-gray-800 mt-3">2.000</p>
    </div>

    <!-- Card 3 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-500">Total Produk</h3>
        <i class="fa-solid fa-box text-orange-600"></i>
      </div>
      <p class="text-2xl font-bold text-gray-800 mt-3">259</p>
    </div>

    <!-- Card 4 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-medium text-gray-500">Total Pengguna</h3>
        <i class="fa-solid fa-users text-purple-600"></i>
      </div>
      <p class="text-2xl font-bold text-gray-800 mt-3">6.000</p>
    </div>

  </section>
</main>
</body>
</html>
